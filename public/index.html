<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Upload ALC</title><style>*{box-sizing:border-box}body{margin:0;background:#10121a;color:#fff;font:16px system-ui;min-height:100vh;display:grid;place-items:center}main{width:min(92%,480px);background:#1b1e2b;border:1px solid #33394b;border-radius:20px;padding:26px}h1{margin:0}p{color:#adb4c6}button,a.btn{display:block;width:100%;margin:12px 0;padding:14px;background:#7868ed;color:#fff;border:0;border-radius:10px;text-align:center;font:600 16px system-ui;text-decoration:none;cursor:pointer}.secondary{background:#34394c}input{width:100%;margin:12px 0;padding:12px;background:#292e40;color:#fff;border:1px solid #555c71;border-radius:10px}progress{width:100%}#link{word-break:break-all}section{display:none}</style><main><h1>Upload ALC</h1><p>Transfira vídeos sem compressão.</p><section id="login"><input id="password" type="password" placeholder="Senha"><button id="enter">Entrar</button></section><section id="upload"><input id="file" type="file" accept="video/*"><button id="send">Enviar vídeo</button><progress id="progress" max="100" value="0" hidden></progress><p id="link"></p></section><section id="viewer"><h3 id="filename"></h3><p id="size"></p><a id="download" class="btn">Baixar vídeo</a><button id="done" class="secondary">Já baixei</button></section><p id="status" role="status"></p></main><script>
const $=id=>document.getElementById(id),video=location.pathname.match(/^\/v\/([^/]+)/)?.[1];let admin=false;
async function api(url,opts){const r=await fetch(url,opts),d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'Erro de conexão');return d}
const msg=s=>$('status').textContent=s;
async function init(){try{admin=(await api('/api/me')).admin;if(video){$('viewer').style.display='block';const d=await api('/api/video/'+video);$('filename').textContent=d.name;$('size').textContent=(d.size/1048576).toFixed(1)+' MB';$('download').href='/api/video/'+video+'/download';$('done').hidden=!admin;if(!admin)$('login').style.display='block'}else $(admin?'upload':'login').style.display='block'}catch(e){msg(e.message);$('viewer').style.display='none'}}
$('enter').onclick=async()=>{try{await api('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:$('password').value})});location.reload()}catch(e){msg(e.message)}};
$('send').onclick=async()=>{const file=$('file').files[0];if(!file)return msg('Selecione um vídeo');$('send').disabled=true;$('progress').hidden=false;msg('Enviando vídeo original...');try{const result=await new Promise((ok,fail)=>{const x=new XMLHttpRequest();x.open('POST','/api/upload');x.setRequestHeader('Content-Type',file.type||'video/mp4');x.setRequestHeader('X-File-Name',file.name.replace(/[^a-zA-Z0-9._-]/g,'_'));x.upload.onprogress=e=>{if(e.lengthComputable)$('progress').value=e.loaded/e.total*100};x.onload=()=>{let d;try{d=JSON.parse(x.responseText)}catch{return fail(Error('Resposta inválida'))}x.status<300?ok(d):fail(Error(d.error||'Falha no upload'))};x.onerror=()=>fail(Error('Falha de conexão'));x.send(file)});const a=document.createElement('a');a.href=result.link;a.textContent=result.link;$('link').replaceChildren(a);msg('Upload concluído! Copie o link.')}catch(e){msg(e.message)}finally{$('send').disabled=false}};
$('done').onclick=async()=>{if(!confirm('Confirma que já baixou? O arquivo será excluído definitivamente.'))return;$('done').disabled=true;try{await api('/api/video/'+video+'/done',{method:'POST'});$('viewer').style.display='none';msg('Arquivo excluído e link encerrado.')}catch(e){msg(e.message);$('done').disabled=false}};
init();
</script></html>
